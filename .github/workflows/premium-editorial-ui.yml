name: Premium Editorial UI

on:
  pull_request:
    paths:
      - "src/app/premium/**"
      - "scripts/verification/verify-premium-editorial-ui.mjs"
      - ".github/workflows/premium-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Premium Editorial UI
        run: node scripts/verification/verify-premium-editorial-ui.mjs
