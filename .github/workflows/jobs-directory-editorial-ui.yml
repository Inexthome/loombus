name: Jobs Directory Editorial UI

on:
  pull_request:
    paths:
      - "src/components/jobs-directory-page.tsx"
      - "scripts/verification/verify-jobs-directory-editorial-ui.mjs"
      - ".github/workflows/jobs-directory-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Jobs directory Editorial UI
        run: node scripts/verification/verify-jobs-directory-editorial-ui.mjs
