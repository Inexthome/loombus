name: Appointments Editorial UI

on:
  pull_request:
    paths:
      - "src/app/appointments/**"
      - "src/components/appointments-manager-page.tsx"
      - "src/components/unified-appointments-overview.tsx"
      - "src/components/professional-booking-availability-card.tsx"
      - "scripts/verification/verify-appointments-editorial-ui.mjs"
      - ".github/workflows/appointments-editorial-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Appointments Editorial UI
        run: node scripts/verification/verify-appointments-editorial-ui.mjs
