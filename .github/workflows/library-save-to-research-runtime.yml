name: Library Save to Research runtime

on:
  pull_request:
    paths:
      - "src/app/api/library/save-to-research/**"
      - "src/app/library/research/**"
      - "src/components/library/library-discuss-passage-launcher.tsx"
      - "src/components/library/library-research-surface.tsx"
      - "scripts/verification/verify-library-save-to-research-runtime.mjs"
      - ".github/workflows/library-save-to-research-runtime.yml"
  push:
    paths:
      - "src/app/api/library/save-to-research/**"
      - "src/app/library/research/**"
      - "src/components/library/library-discuss-passage-launcher.tsx"
      - "src/components/library/library-research-surface.tsx"
      - "scripts/verification/verify-library-save-to-research-runtime.mjs"
      - ".github/workflows/library-save-to-research-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-save-to-research-runtime.mjs
