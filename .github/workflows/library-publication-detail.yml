name: Library publication detail

on:
  pull_request:
    paths:
      - 'src/app/library/publication/\[publicationId\]/page.tsx'
      - "src/components/library/library-publication-detail.tsx"
      - 'src/app/library/read/\[publicationId\]/page.tsx'
      - "scripts/verification/verify-library-publication-detail.mjs"
      - ".github/workflows/library-publication-detail.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Library publication detail
        run: node scripts/verification/verify-library-publication-detail.mjs
