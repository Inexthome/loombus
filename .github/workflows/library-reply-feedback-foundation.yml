name: Library reply feedback foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260822090000_add_library_reply_feedback_foundation.sql"
      - "scripts/verification/verify-library-reply-feedback-foundation.mjs"
      - ".github/workflows/library-reply-feedback-foundation.yml"
  push:
    paths:
      - "supabase/migrations/20260822090000_add_library_reply_feedback_foundation.sql"
      - "scripts/verification/verify-library-reply-feedback-foundation.mjs"
      - ".github/workflows/library-reply-feedback-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-reply-feedback-foundation.mjs
