name: Library Knowledge Graph v6 runtime

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/graph/**"
      - "src/components/library/library-knowledge-graph-v6-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v6-runtime.mjs"
      - ".github/workflows/library-knowledge-graph-v6-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Library Knowledge Graph v6 runtime
        run: node scripts/verification/verify-library-knowledge-graph-v6-runtime.mjs
