name: Library knowledge discussion promotion runtime

on:
  pull_request:
    paths:
      - "src/app/api/library/knowledge-discussion/**"
      - "src/app/library/research/evidence/**"
      - "src/components/library/library-knowledge-discussion-promotion-surface.tsx"
      - "scripts/verification/verify-library-knowledge-discussion-promotion-runtime.mjs"
      - ".github/workflows/library-knowledge-discussion-promotion-runtime.yml"
  push:
    paths:
      - "src/app/api/library/knowledge-discussion/**"
      - "src/app/library/research/evidence/**"
      - "src/components/library/library-knowledge-discussion-promotion-surface.tsx"
      - "scripts/verification/verify-library-knowledge-discussion-promotion-runtime.mjs"
      - ".github/workflows/library-knowledge-discussion-promotion-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-knowledge-discussion-promotion-runtime.mjs
