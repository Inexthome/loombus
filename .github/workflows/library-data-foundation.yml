name: Library data foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/*library*"
      - "supabase/tests/library_data_foundation_*"
      - "scripts/verification/verify-library-data-foundation.mjs"
      - "scripts/verification/verify-library-migration-static.mjs"
      - "scripts/verification/verify-library-note-binding-repair.mjs"
      - ".github/workflows/library-data-foundation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*library*"
      - "supabase/tests/library_data_foundation_*"
      - "scripts/verification/verify-library-data-foundation.mjs"
      - "scripts/verification/verify-library-migration-static.mjs"
      - "scripts/verification/verify-library-note-binding-repair.mjs"
      - ".github/workflows/library-data-foundation.yml"

permissions:
  contents: read

jobs:
  verify-library-data-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Library data contract
        run: node scripts/verification/verify-library-data-foundation.mjs
      - name: Verify Library migration safety
        run: node scripts/verification/verify-library-migration-static.mjs
      - name: Verify Library note binding repair
        run: node scripts/verification/verify-library-note-binding-repair.mjs
