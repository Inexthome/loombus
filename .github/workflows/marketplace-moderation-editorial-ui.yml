name: Marketplace Moderation Editorial UI

on:
  pull_request:
    paths:
      - "src/components/marketplace-admin-review.tsx"
      - "src/components/marketplace-manager-page.tsx"
      - "scripts/verification/verify-marketplace-moderation-editorial-ui.mjs"
      - ".github/workflows/marketplace-moderation-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Marketplace moderation Editorial UI
        run: node scripts/verification/verify-marketplace-moderation-editorial-ui.mjs
