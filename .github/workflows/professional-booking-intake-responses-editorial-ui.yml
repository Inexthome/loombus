name: Professional Booking Intake Responses Editorial UI

on:
  pull_request:
    paths:
      - "src/components/professional-booking-intake-responses-page.tsx"
      - "scripts/verification/verify-professional-booking-intake-responses-editorial-ui.mjs"
      - ".github/workflows/professional-booking-intake-responses-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Professional Booking Intake Responses Editorial UI
        run: node scripts/verification/verify-professional-booking-intake-responses-editorial-ui.mjs
