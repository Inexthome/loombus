name: Calendar Editorial UI

on:
  pull_request:
    paths:
      - "src/components/calendar-page.tsx"
      - "src/components/calendar-external-sync-panel.tsx"
      - "scripts/verification/verify-calendar-editorial-ui.mjs"
      - ".github/workflows/calendar-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Calendar Editorial UI
        run: node scripts/verification/verify-calendar-editorial-ui.mjs
