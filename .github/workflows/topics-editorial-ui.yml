name: Topics Editorial UI

on:
  pull_request:
    paths:
      - "src/app/topics/page.tsx"
      - "src/app/topics/signal-directory-client.tsx"
      - "src/app/topics/signal-directory-card.tsx"
      - "src/app/topics/signal-directory-detail.tsx"
      - "src/app/topics/use-signal-directory-data.ts"
      - "src/app/topics/topics-editorial.css"
      - "scripts/verification/verify-topics-editorial-ui.mjs"
      - ".github/workflows/topics-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Topics Editorial UI
        run: node scripts/verification/verify-topics-editorial-ui.mjs
