name: Verify Library commerce production hardening

on:
  pull_request:
    paths:
      - "src/app/api/library/commerce/route.ts"
      - "src/app/api/library/ask-loombus/route.ts"
      - "src/components/library/library-purchase-button.tsx"
      - "src/components/library/library-commerce-center.tsx"
      - "src/lib/library-commerce-server.ts"
      - "src/lib/library-commerce-events-server.ts"
      - "supabase/migrations/**"
      - "scripts/verification/verify-library-commerce-production-hardening.mjs"
      - ".github/workflows/library-commerce-production-hardening.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/library/commerce/route.ts"
      - "src/app/api/library/ask-loombus/route.ts"
      - "src/components/library/library-purchase-button.tsx"
      - "src/components/library/library-commerce-center.tsx"
      - "src/lib/library-commerce-server.ts"
      - "src/lib/library-commerce-events-server.ts"
      - "supabase/migrations/**"
      - "scripts/verification/verify-library-commerce-production-hardening.mjs"
      - ".github/workflows/library-commerce-production-hardening.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Library commerce production hardening
        run: node scripts/verification/verify-library-commerce-production-hardening.mjs
