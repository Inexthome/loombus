name: Matches and Stickies Editorial UI

on:
  pull_request:
    paths:
      - "src/app/matches/page.tsx"
      - "src/app/matches/matches-editorial.css"
      - "src/components/intelligent-matching-page.tsx"
      - "src/app/stickies/page.tsx"
      - "src/app/stickies/stickies-v2-client.tsx"
      - "src/app/stickies/stickies-v2.css"
      - "src/app/stickies/stickies-editorial.css"
      - "scripts/verification/verify-matches-stickies-editorial-ui.mjs"
      - ".github/workflows/matches-stickies-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Matches and Stickies Editorial UI
        run: node scripts/verification/verify-matches-stickies-editorial-ui.mjs
