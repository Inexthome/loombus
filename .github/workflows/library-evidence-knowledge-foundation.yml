name: Library evidence knowledge foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260817235500_add_library_evidence_knowledge_foundation.sql"
      - "scripts/verification/verify-library-evidence-knowledge-foundation.mjs"
      - ".github/workflows/library-evidence-knowledge-foundation.yml"
  push:
    paths:
      - "supabase/migrations/20260817235500_add_library_evidence_knowledge_foundation.sql"
      - "scripts/verification/verify-library-evidence-knowledge-foundation.mjs"
      - ".github/workflows/library-evidence-knowledge-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-evidence-knowledge-foundation.mjs
