name: Library Knowledge Graph v5

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/graph/**"
      - "src/components/library/library-knowledge-graph-v5-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v5.mjs"
      - ".github/workflows/library-knowledge-graph-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify Knowledge Graph v5 contract
        run: node scripts/verification/verify-library-knowledge-graph-v5.mjs
