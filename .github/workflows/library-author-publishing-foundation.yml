name: Library Author Publishing Foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260822223000_add_library_author_publishing_foundation.sql"
      - "scripts/verification/verify-library-author-publishing-foundation.mjs"
      - ".github/workflows/library-author-publishing-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-author-publishing-foundation.mjs
