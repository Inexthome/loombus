name: Library author review workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260823002000_add_library_author_review_workflow.sql"
      - "src/app/admin/library-review/**"
      - "src/components/admin-library-review-client.tsx"
      - "scripts/verification/verify-library-author-review-workflow.mjs"
      - ".github/workflows/library-author-review-workflow.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Library author review workflow
        run: node scripts/verification/verify-library-author-review-workflow.mjs
