name: Library reply feedback runtime

on:
  pull_request:
    paths:
      - "src/app/api/library/reply-feedback/create/route.ts"
      - "src/app/library/research/from-reply/page.tsx"
      - "src/components/library/library-reply-feedback-surface.tsx"
      - "src/components/library/discussion-library-feedback-launcher.tsx"
      - "scripts/verification/verify-library-reply-feedback-runtime.mjs"
      - ".github/workflows/library-reply-feedback-runtime.yml"
  push:
    paths:
      - "src/app/api/library/reply-feedback/create/route.ts"
      - "src/app/library/research/from-reply/page.tsx"
      - "src/components/library/library-reply-feedback-surface.tsx"
      - "src/components/library/discussion-library-feedback-launcher.tsx"
      - "scripts/verification/verify-library-reply-feedback-runtime.mjs"
      - ".github/workflows/library-reply-feedback-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-reply-feedback-runtime.mjs
