name: Core Surface Backgrounds

on:
  pull_request:
    paths:
      - "src/app/library/**"
      - "src/app/messages/**"
      - "src/app/u/[username]/**"
      - "src/app/the-floor/**"
      - "scripts/verification/verify-core-surface-backgrounds.mjs"
      - ".github/workflows/core-surface-backgrounds.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify core surface backgrounds
        run: node scripts/verification/verify-core-surface-backgrounds.mjs
