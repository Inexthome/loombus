name: Request Detail Editorial UI

on:
  pull_request:
    paths:
      - "src/app/requests/[slug]/**"
      - "src/components/request-detail-page.tsx"
      - "scripts/verification/verify-request-detail-editorial-ui.mjs"
      - ".github/workflows/request-detail-editorial-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Request Detail Editorial UI
        run: node scripts/verification/verify-request-detail-editorial-ui.mjs
