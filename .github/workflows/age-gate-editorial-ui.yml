name: Age Gate Editorial UI

on:
  pull_request:
    paths:
      - "src/app/age-gate/page.tsx"
      - "scripts/verification/verify-age-gate-editorial-ui.mjs"
      - ".github/workflows/age-gate-editorial-ui.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/age-gate/page.tsx"
      - "scripts/verification/verify-age-gate-editorial-ui.mjs"
      - ".github/workflows/age-gate-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Age Gate Editorial UI
        run: node scripts/verification/verify-age-gate-editorial-ui.mjs
