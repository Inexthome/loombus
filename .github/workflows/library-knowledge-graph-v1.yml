name: Library Knowledge Graph v1

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/graph/**"
      - "src/app/library/research/evidence/page.tsx"
      - "src/components/library/library-knowledge-graph-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v1.mjs"
      - ".github/workflows/library-knowledge-graph-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/app/library/research/evidence/graph/**"
      - "src/app/library/research/evidence/page.tsx"
      - "src/components/library/library-knowledge-graph-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v1.mjs"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-knowledge-graph-v1.mjs
