name: My Discussions Editorial UI

on:
  pull_request:
    paths:
      - "src/app/my-discussions/my-discussions-v2-client.tsx"
      - "scripts/verification/verify-my-discussions-editorial-ui.mjs"
      - ".github/workflows/my-discussions-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify My Discussions Editorial UI
        run: node scripts/verification/verify-my-discussions-editorial-ui.mjs
