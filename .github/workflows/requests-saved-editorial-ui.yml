name: Requests Saved Editorial UI

on:
  pull_request:
    paths:
      - "src/app/requests/saved/**"
      - "src/components/requests-saved-page.tsx"
      - "scripts/verification/verify-requests-saved-editorial-ui.mjs"
      - ".github/workflows/requests-saved-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify saved Requests Editorial UI
        run: node scripts/verification/verify-requests-saved-editorial-ui.mjs
