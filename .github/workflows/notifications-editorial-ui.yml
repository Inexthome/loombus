name: Notifications Editorial UI

on:
  pull_request:
    paths:
      - "src/app/notifications/page.tsx"
      - "src/app/notifications/notifications-v2-client.tsx"
      - "src/app/notifications/notifications-v2.css"
      - "src/app/notifications/notifications-editorial.css"
      - "src/app/notifications/follow-request-actions.tsx"
      - "src/app/notifications/teen-safety-notification-destinations.tsx"
      - "scripts/verification/verify-notifications-editorial-ui.mjs"
      - ".github/workflows/notifications-editorial-ui.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/notifications/page.tsx"
      - "src/app/notifications/notifications-v2-client.tsx"
      - "src/app/notifications/notifications-v2.css"
      - "src/app/notifications/notifications-editorial.css"
      - "src/app/notifications/follow-request-actions.tsx"
      - "src/app/notifications/teen-safety-notification-destinations.tsx"
      - "scripts/verification/verify-notifications-editorial-ui.mjs"
      - ".github/workflows/notifications-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Notifications Editorial UI
        run: node scripts/verification/verify-notifications-editorial-ui.mjs
