name: Library author metadata runtime

on:
  pull_request:
    paths:
      - "supabase/migrations/20260824094500_wire_library_richer_metadata_discovery.sql"
      - "src/components/library/library-bibliographic-metadata-editor.tsx"
      - "src/components/library/library-author-epub-upload.tsx"
      - "src/app/library/publish/revisions/page.tsx"
      - "src/app/admin/library-review/revisions/page.tsx"
      - "src/components/library/library-admin-normalized-preview.tsx"
      - "src/components/library/library-publication-detail.tsx"
      - "src/components/library/library-discover-catalog.tsx"
      - "scripts/verification/verify-library-author-metadata-runtime.mjs"
      - ".github/workflows/library-author-metadata-runtime.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verification/verify-library-author-metadata-runtime.mjs
