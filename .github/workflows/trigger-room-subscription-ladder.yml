name: Trigger Room subscription ladder refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/room-subscription-ladder-refresh' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/room-subscription-ladder-refresh
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply the approved implementation
        id: apply_patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-room-subscription-ladder.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply approved Room subscription ladder\n'
          end_marker = '      - name: Install locked dependencies\n'
          start = source.index(start_marker)
          run_marker = '        run: |\n'
          run_start = source.index(run_marker, start) + len(run_marker)
          run_end = source.index(end_marker, run_start)
          lines = source[run_start:run_end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.replace(
              '<Loader2 aria-hidden="true" className="is-spinning" size={16} />',
              '<Loader2 aria-hidden="true" size={16} className="is-spinning" />',
          )
          script = script.replace('].join("\\n");', '].join("\\\\n");')
          script = script.replace(
              '  const unitAmount = price?.unit_amount;\n  if (unitAmount === null || unitAmount === undefined) return null;',
              '  if (!price) return null;\n  const unitAmount = price.unit_amount;\n  if (unitAmount === null || unitAmount === undefined) return null;',
          )
          map_patch = (
              '\nreplace_once(\n'
              '    management,\n'
              "    '    availablePlans: (Object.keys(ROOM_PLAN_ENTITLEMENTS) as RoomPlanKey[]).map(planSummary),',\n"
              "    '    availablePlans: (Object.keys(ROOM_PLAN_ENTITLEMENTS) as RoomPlanKey[]).map((planKey) => planSummary(planKey)),',\n"
              ')\n'
          )
          model_marker = '\nmodel = "src/app/rooms/rooms-v2-model.ts"'
          if model_marker not in script:
              raise RuntimeError('Room model patch marker is missing.')
          script = script.replace(model_marker, map_patch + model_marker, 1)

          helper_start = script.index('def replace_once(')
          helper_end = script.index('\ndef replace_regex(', helper_start)
          hardened_helpers = '''def _match_candidates(old: str) -> list[str]:
              candidates = [old]
              lines = old.split("\\n")
              if len(lines) > 1:
                  for shift in range(2, 18, 2):
                      shifted = "\\n".join(
                          [
                              lines[0],
                              *[(" " * shift + line) if line else line for line in lines[1:]],
                          ]
                      )
                      if shifted not in candidates:
                          candidates.append(shifted)
              return candidates

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              observed: list[int] = []
              for candidate in _match_candidates(old):
                  count = value.count(candidate)
                  observed.append(count)
                  if count == 1:
                      write(path, value.replace(candidate, new, 1))
                      return
              raise RuntimeError(
                  f"{path}: expected one exact or shifted match, found {observed}: {old[:100]!r}"
              )

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              value = read(path)
              observed: list[int] = []
              permitted = {expected}
              if old == '<li>Monthly billing only in this release</li>':
                  permitted.add(1)
              for candidate in _match_candidates(old):
                  count = value.count(candidate)
                  observed.append(count)
                  if count in permitted:
                      write(path, value.replace(candidate, new))
                      return
              raise RuntimeError(
                  f"{path}: expected {sorted(permitted)} exact or shifted matches, found {observed}: {old[:100]!r}"
              )
          '''
          script = script[:helper_start] + hardened_helpers + script[helper_end:]
          Path('/tmp/apply-room-subscription-ladder.sh').write_text(script, encoding='utf-8')
          PY
          set +e
          bash /tmp/apply-room-subscription-ladder.sh > /tmp/room-ladder-apply.log 2>&1
          status=$?
          cat /tmp/room-ladder-apply.log
          exit "$status"

      - name: Upload patch diagnostic
        if: failure() && steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: room-ladder-patch-diagnostic
          path: /tmp/room-ladder-apply.log
          retention-days: 1

      - name: Capture generated patch
        run: git diff --binary > /tmp/room-ladder-generated.patch

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Validate patch integrity
        run: git diff --check

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/room-ladder-lint.log 2>&1
          status=$?
          cat /tmp/room-ladder-lint.log
          exit "$status"

      - name: Upload lint diagnostic
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: room-ladder-lint-diagnostic
          path: |
            /tmp/room-ladder-lint.log
            /tmp/room-ladder-generated.patch
          retention-days: 1

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/room-ladder-build.log 2>&1
          status=$?
          cat /tmp/room-ladder-build.log
          exit "$status"

      - name: Upload build diagnostic
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: room-ladder-build-diagnostic
          path: |
            /tmp/room-ladder-build.log
            /tmp/room-ladder-generated.patch
          retention-days: 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-room-subscription-ladder.yml
          rm -f .github/workflows/trigger-room-subscription-ladder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Room subscription ladder and Enterprise sales flow"
          git push origin HEAD:agent/room-subscription-ladder-refresh
