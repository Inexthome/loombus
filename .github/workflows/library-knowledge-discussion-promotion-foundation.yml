name: Library Knowledge Discussion promotion foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260818014500_add_library_knowledge_discussion_promotion_foundation.sql"
      - "scripts/verification/verify-library-knowledge-discussion-promotion-foundation.mjs"
      - ".github/workflows/library-knowledge-discussion-promotion-foundation.yml"
  push:
    paths:
      - "supabase/migrations/20260818014500_add_library_knowledge_discussion_promotion_foundation.sql"
      - "scripts/verification/verify-library-knowledge-discussion-promotion-foundation.mjs"
      - ".github/workflows/library-knowledge-discussion-promotion-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-knowledge-discussion-promotion-foundation.mjs
