name: Age Safety Editorial UI

on:
  pull_request:
    paths:
      - "src/app/account/age-safety/age-safety-client.tsx"
      - "src/app/account/age-safety/page.tsx"
      - "scripts/verification/verify-age-safety-editorial-ui.mjs"
      - ".github/workflows/age-safety-editorial-ui.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/account/age-safety/age-safety-client.tsx"
      - "src/app/account/age-safety/page.tsx"
      - "scripts/verification/verify-age-safety-editorial-ui.mjs"
      - ".github/workflows/age-safety-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Age Safety Editorial UI
        run: node scripts/verification/verify-age-safety-editorial-ui.mjs
