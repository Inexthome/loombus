name: Settings information architecture

on:
  pull_request:
    paths:
      - "src/app/settings/**"
      - "src/components/settings-workspace-controller.tsx"
      - "src/app/profile/layout.tsx"
      - "scripts/verification/verify-settings-information-architecture.mjs"
      - ".github/workflows/settings-information-architecture.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Settings information architecture
        run: node scripts/verification/verify-settings-information-architecture.mjs
