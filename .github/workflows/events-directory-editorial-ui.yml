name: Events Directory Editorial UI

on:
  pull_request:
    paths:
      - "src/components/events-directory-page.tsx"
      - "src/app/events/page.tsx"
      - "scripts/verification/verify-events-directory-editorial-ui.mjs"
      - ".github/workflows/events-directory-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Events Directory Editorial UI
        run: node scripts/verification/verify-events-directory-editorial-ui.mjs
