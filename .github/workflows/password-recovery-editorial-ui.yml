name: Password Recovery Editorial UI

on:
  pull_request:
    paths:
      - "src/app/forgot-password/page.tsx"
      - "src/app/forgot-password/layout.tsx"
      - "src/app/forgot-password/forgot-password-editorial.css"
      - "src/app/reset-password/page.tsx"
      - "scripts/verification/verify-password-recovery-editorial-ui.mjs"
      - ".github/workflows/password-recovery-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Password Recovery Editorial UI
        run: node scripts/verification/verify-password-recovery-editorial-ui.mjs
