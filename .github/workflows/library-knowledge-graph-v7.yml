name: Library Knowledge Graph v7

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/graph/page.tsx"
      - "src/components/library/library-knowledge-graph-v7-surface.tsx"
      - "src/components/library/library-knowledge-graph-v6-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v2.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v3.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v4.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v5.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v6-runtime.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v7.mjs"
      - ".github/workflows/library-knowledge-graph-v7.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-knowledge-graph-v7.mjs
      - run: node scripts/verification/verify-library-knowledge-graph-v6-runtime.mjs
      - run: node scripts/verification/verify-library-knowledge-graph-v5.mjs
      - run: node scripts/verification/verify-library-knowledge-graph-v4.mjs
      - run: node scripts/verification/verify-library-knowledge-graph-v3.mjs
      - run: node scripts/verification/verify-library-knowledge-graph-v2.mjs
