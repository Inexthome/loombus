name: Library Knowledge Graph v2

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/graph/**"
      - "src/app/library/research/evidence/provenance/**"
      - "src/components/library/library-knowledge-graph-v2-surface.tsx"
      - "src/components/library/library-focused-provenance-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v2.mjs"
      - ".github/workflows/library-knowledge-graph-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify Library Knowledge Graph v2
        run: node scripts/verification/verify-library-knowledge-graph-v2.mjs
