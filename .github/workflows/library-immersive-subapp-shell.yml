name: Library immersive sub-app shell

on:
  pull_request:
    paths:
      - "src/app/library/**"
      - "src/components/library/**"
      - "src/components/app-chrome-boundary.tsx"
      - "scripts/verification/verify-library-immersive-subapp-shell.mjs"
      - ".github/workflows/library-immersive-subapp-shell.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify immersive Library shell
        run: node scripts/verification/verify-library-immersive-subapp-shell.mjs
