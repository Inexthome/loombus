name: Job Profile Editorial UI

on:
  pull_request:
    paths:
      - "src/components/job-profile-page.tsx"
      - "scripts/verification/verify-job-profile-editorial-ui.mjs"
      - ".github/workflows/job-profile-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify job profile Editorial UI
        run: node scripts/verification/verify-job-profile-editorial-ui.mjs
