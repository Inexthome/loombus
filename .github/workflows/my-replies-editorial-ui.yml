name: My Replies Editorial UI

on:
  pull_request:
    paths:
      - "src/app/my-replies/my-replies-v2-client.tsx"
      - "scripts/verification/verify-my-replies-editorial-ui.mjs"
      - ".github/workflows/my-replies-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify My Replies Editorial UI
        run: node scripts/verification/verify-my-replies-editorial-ui.mjs
