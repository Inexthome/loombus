name: Library Save to Research foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260817121500_add_library_research_items_foundation.sql"
      - "scripts/verification/verify-library-save-to-research-foundation.mjs"
      - ".github/workflows/library-save-to-research-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verification/verify-library-save-to-research-foundation.mjs
