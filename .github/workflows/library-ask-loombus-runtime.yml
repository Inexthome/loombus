name: Library Ask Loombus runtime

on:
  pull_request:
    paths:
      - "src/components/library/library-discuss-passage-launcher.tsx"
      - "src/components/library/library-ask-loombus-panel.tsx"
      - "src/app/library/ask-loombus/page.tsx"
      - "src/app/api/library/ask-loombus/route.ts"
      - "src/lib/premium-ai.ts"
      - "scripts/verification/verify-library-ask-loombus-runtime.mjs"
      - ".github/workflows/library-ask-loombus-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/verification/verify-library-ask-loombus-runtime.mjs
