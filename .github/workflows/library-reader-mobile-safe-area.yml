name: Library Reader mobile safe area

on:
  pull_request:
    paths:
      - "src/app/library/read/**"
      - "src/components/library/library-reader-mobile-safe-area.tsx"
      - "scripts/verification/verify-library-reader-mobile-safe-area.mjs"
      - ".github/workflows/library-reader-mobile-safe-area.yml"

jobs:
  verify-library-reader-mobile-safe-area:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Library Reader mobile safe area
        run: node scripts/verification/verify-library-reader-mobile-safe-area.mjs
