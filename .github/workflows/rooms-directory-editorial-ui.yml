name: Rooms directory Editorial UI

on:
  pull_request:
    paths:
      - "src/app/rooms/page.tsx"
      - "src/components/rooms-directory-v3.tsx"
      - "scripts/verification/verify-rooms-directory-editorial-ui.mjs"
      - ".github/workflows/rooms-directory-editorial-ui.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/rooms/page.tsx"
      - "src/components/rooms-directory-v3.tsx"
      - "scripts/verification/verify-rooms-directory-editorial-ui.mjs"
      - ".github/workflows/rooms-directory-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Rooms directory Editorial UI
        run: node scripts/verification/verify-rooms-directory-editorial-ui.mjs
