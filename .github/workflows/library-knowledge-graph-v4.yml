name: Library Knowledge Graph v4

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/graph/page.tsx"
      - "src/components/library/library-knowledge-graph-v4-surface.tsx"
      - "scripts/verification/verify-library-knowledge-graph-v4.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v3.mjs"
      - "scripts/verification/verify-library-knowledge-graph-v2.mjs"
      - ".github/workflows/library-knowledge-graph-v4.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Library Knowledge Graph v4
        run: node scripts/verification/verify-library-knowledge-graph-v4.mjs
