name: File security posture

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "docs/security/**"
      - "scripts/verification/verify-file-security-posture.mjs"
      - "package.json"
      - ".github/workflows/file-security-posture.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "docs/security/**"
      - "scripts/verification/verify-file-security-posture.mjs"
      - "package.json"
      - ".github/workflows/file-security-posture.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify file security posture
        run: node scripts/verification/verify-file-security-posture.mjs
