name: Labs Editorial UI

on:
  pull_request:
    paths:
      - "src/app/labs/**"
      - "scripts/verification/verify-labs-editorial-ui.mjs"
      - ".github/workflows/labs-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Labs Editorial UI
        run: node scripts/verification/verify-labs-editorial-ui.mjs
