name: Admin Trust and Safety Editorial UI

on:
  pull_request:
    paths:
      - "src/app/admin/reports/**"
      - "src/app/admin/safety/**"
      - "src/app/admin/enforcement/**"
      - "src/app/admin/deleted/**"
      - "src/app/admin/deleted-replies/**"
      - "src/app/admin/audit/**"
      - "src/app/admin/trust-safety-editorial.css"
      - "scripts/verification/verify-admin-trust-safety-editorial-ui.mjs"
      - ".github/workflows/admin-trust-safety-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Admin Trust and Safety Editorial UI
        run: node scripts/verification/verify-admin-trust-safety-editorial-ui.mjs
