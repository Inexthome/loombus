name: AI Usage Editorial UI

on:
  pull_request:
    paths:
      - "src/app/ai-usage/ai-usage-v2.css"
      - "src/app/ai-usage/page.tsx"
      - "scripts/verification/verify-ai-usage-editorial-ui.mjs"
      - ".github/workflows/ai-usage-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify AI Usage Editorial UI
        run: node scripts/verification/verify-ai-usage-editorial-ui.mjs
