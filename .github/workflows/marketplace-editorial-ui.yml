name: Marketplace Editorial UI

on:
  pull_request:
    paths:
      - "src/app/marketplace/**"
      - "src/components/marketplace-**"
      - "scripts/verification/verify-marketplace-editorial-ui.mjs"
      - ".github/workflows/marketplace-editorial-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Marketplace Editorial UI
        run: node scripts/verification/verify-marketplace-editorial-ui.mjs
