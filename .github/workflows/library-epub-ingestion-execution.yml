name: Library EPUB ingestion execution

on:
  pull_request:
    paths:
      - "src/lib/library/epub-validation.ts"
      - "src/lib/library/epub-manifest.ts"
      - "src/lib/library/ingestion-state.ts"
      - "scripts/verification/verify-library-epub-ingestion-execution.mjs"
      - ".github/workflows/library-epub-ingestion-execution.yml"

permissions:
  contents: read

jobs:
  verify-library-epub-ingestion-execution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Library EPUB ingestion execution boundary
        run: node scripts/verification/verify-library-epub-ingestion-execution.mjs
