name: Messages Editorial UI

on:
  pull_request:
    paths:
      - "src/app/messages/layout.tsx"
      - "src/app/messages/page.tsx"
      - "src/app/messages/messages-v2-client.tsx"
      - "src/app/messages/messages-v2-components.tsx"
      - "src/app/messages/messages-v2-model.ts"
      - "src/app/messages/use-messages-v2.ts"
      - "src/app/messages/messages-v2.css"
      - "src/app/messages/messages-editorial.css"
      - "scripts/verification/verify-messages-editorial-ui.mjs"
      - ".github/workflows/messages-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Messages Editorial UI
        run: node scripts/verification/verify-messages-editorial-ui.mjs
