name: Library EPUB chapter normalization

on:
  pull_request:
    paths:
      - "src/lib/library/epub-parser.ts"
      - "src/lib/library/epub-manifest.ts"
      - "scripts/verification/verify-library-epub-chapter-normalization.mjs"
      - ".github/workflows/library-epub-chapter-normalization.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Library EPUB chapter normalization
        run: node scripts/verification/verify-library-epub-chapter-normalization.mjs
