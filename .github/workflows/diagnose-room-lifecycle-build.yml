name: Diagnose Room lifecycle build

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/room-search-export-lifecycle'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture production build
        id: build
        continue-on-error: true
        run: npm run build > room-lifecycle-build.log 2>&1
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: room-lifecycle-build-diagnostic
          path: room-lifecycle-build.log
      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 200 room-lifecycle-build.log
          exit 1
