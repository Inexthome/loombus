name: Unified Admin Needs Attention

on:
  pull_request:
    paths:
      - "src/app/admin/admin-operations-client.tsx"
      - "src/app/api/admin/attention/**"
      - "src/app/notifications/**"
      - "supabase/migrations/*admin_needs_attention*.sql"
      - "scripts/verification/verify-unified-admin-needs-attention.mjs"
      - ".github/workflows/unified-admin-needs-attention.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify durable Admin Needs Attention lifecycle
        run: node scripts/verification/verify-unified-admin-needs-attention.mjs
