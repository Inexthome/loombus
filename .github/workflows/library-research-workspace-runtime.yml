name: Library Research workspace runtime

on:
  pull_request:
    paths:
      - "src/components/library/library-research-surface.tsx"
      - "scripts/verification/verify-library-research-workspace-runtime.mjs"
      - ".github/workflows/library-research-workspace-runtime.yml"
  push:
    paths:
      - "src/components/library/library-research-surface.tsx"
      - "scripts/verification/verify-library-research-workspace-runtime.mjs"
      - ".github/workflows/library-research-workspace-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-research-workspace-runtime.mjs
