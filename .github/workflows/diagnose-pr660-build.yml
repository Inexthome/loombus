name: Diagnose PR 660 build

on:
  push:
    branches:
      - agent/member-privacy-viewers-directory

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies quietly
        run: npm ci --silent
      - name: Print focused build failure
        shell: bash
        run: |
          set +e
          npm run build > /tmp/loombus-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "BUILD_FAILED"
            tail -n 140 /tmp/loombus-build.log
            exit "$status"
          fi
          echo "BUILD_PASSED"
