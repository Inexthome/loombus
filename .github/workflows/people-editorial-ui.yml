name: People Editorial UI

on:
  pull_request:
    paths:
      - "src/app/people/**"
      - "scripts/verification/verify-people-editorial-ui.mjs"
      - ".github/workflows/people-editorial-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify People Editorial UI
        run: node scripts/verification/verify-people-editorial-ui.mjs
