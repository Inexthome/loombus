name: Services Editorial UI

on:
  pull_request:
    paths:
      - "src/components/services-directory-page.tsx"
      - "src/components/services-saved-page.tsx"
      - "src/app/services/page.tsx"
      - "src/app/services/saved/page.tsx"
      - "src/app/services/services-editorial.css"
      - "scripts/verification/verify-services-editorial-ui.mjs"
      - ".github/workflows/services-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Services Editorial UI
        run: node scripts/verification/verify-services-editorial-ui.mjs
