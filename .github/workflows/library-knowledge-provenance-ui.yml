name: Library knowledge provenance UI

on:
  pull_request:
    paths:
      - "src/app/library/research/evidence/**"
      - "src/components/library/library-knowledge-provenance-surface.tsx"
      - "scripts/verification/verify-library-knowledge-provenance-ui.mjs"
      - ".github/workflows/library-knowledge-provenance-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify provenance history surface
        run: node scripts/verification/verify-library-knowledge-provenance-ui.mjs
