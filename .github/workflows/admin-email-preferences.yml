name: Admin email preferences

on:
  pull_request:
    paths:
      - "src/app/admin/communications/**"
      - "src/app/api/admin/member-email/**"
      - "src/app/api/email/unsubscribe/**"
      - "src/app/api/webhooks/resend/**"
      - "src/app/email/unsubscribe/**"
      - "supabase/migrations/**"
      - "scripts/verification/verify-admin-email-preferences.mjs"
      - ".github/workflows/admin-email-preferences.yml"
  push:
    branches: [main]
    paths:
      - "src/app/admin/communications/**"
      - "src/app/api/admin/member-email/**"
      - "src/app/api/email/unsubscribe/**"
      - "src/app/api/webhooks/resend/**"
      - "src/app/email/unsubscribe/**"
      - "supabase/migrations/**"
      - "scripts/verification/verify-admin-email-preferences.mjs"
      - ".github/workflows/admin-email-preferences.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Admin email preferences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verification/verify-admin-email-preferences.mjs
