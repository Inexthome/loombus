name: Library discovery scalability

on:
  pull_request:
    paths:
      - "supabase/migrations/20260824084500_scale_library_discovery_search.sql"
      - "src/components/library/library-functional-surface.tsx"
      - "src/components/library/library-discover-catalog.tsx"
      - "src/components/library/library-authors-catalog.tsx"
      - "scripts/verification/verify-library-discovery-scalability.mjs"
      - ".github/workflows/library-discovery-scalability.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Library discovery scalability
        run: node scripts/verification/verify-library-discovery-scalability.mjs
