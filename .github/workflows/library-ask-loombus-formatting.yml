name: Library Ask Loombus formatting

on:
  pull_request:
    paths:
      - "src/components/library/library-ask-loombus-panel.tsx"
      - "scripts/verification/verify-library-ask-loombus-formatting.mjs"
      - ".github/workflows/library-ask-loombus-formatting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verification/verify-library-ask-loombus-formatting.mjs
