name: Marketplace reserved lifecycle

on:
  pull_request:
    paths:
      - "src/lib/marketplace.ts"
      - "src/lib/marketplace-server-normalize.ts"
      - "src/lib/marketplace-server-read.ts"
      - "src/lib/marketplace-public-server.ts"
      - "src/lib/marketplace-server-lifecycle.ts"
      - "src/app/api/marketplace/route.ts"
      - "src/app/api/marketplace/contact/**"
      - "src/app/marketplace/[slug]/page.tsx"
      - "src/components/marketplace-seller-listings.tsx"
      - "src/components/marketplace-seller-contact-actions.tsx"
      - "src/components/marketplace-directory-page.tsx"
      - "src/components/marketplace-saved-page.tsx"
      - "src/app/messages/messages-v2-model.ts"
      - "supabase/migrations/20260829103000_add_marketplace_reserved_lifecycle.sql"
      - "scripts/verification/verify-marketplace-reserved-lifecycle.mjs"
      - ".github/workflows/marketplace-reserved-lifecycle.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Marketplace Reserved lifecycle
        run: node scripts/verification/verify-marketplace-reserved-lifecycle.mjs
