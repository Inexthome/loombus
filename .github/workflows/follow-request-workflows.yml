name: Follow request workflows

on:
  pull_request:
    paths:
      - "src/app/api/follows/requests/**"
      - "src/app/people/**"
      - "src/app/notifications/follow-request-actions.tsx"
      - "src/components/member-privacy-settings-bridge.tsx"
      - "scripts/verification/verify-follow-request-workflows.mjs"
      - ".github/workflows/follow-request-workflows.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify follow request workflows
        run: node scripts/verification/verify-follow-request-workflows.mjs
