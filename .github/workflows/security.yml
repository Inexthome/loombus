name: Security checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: build and lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Verify outbound email sender policy
        run: node scripts/verify-email-sender-policy.mjs

      - name: Build
        run: npm run build

      - name: Upload failed Next.js build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: next-build-log
          path: /tmp/loombus-next-build.log
          if-no-files-found: warn
          retention-days: 3

  dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build production dependency graph for audit
        run: npm install --omit=dev --ignore-scripts --no-audit

      - name: Audit production dependency vulnerabilities
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            audit_log="$(mktemp)"
            set +e
            npm audit --omit=dev --audit-level=high 2>&1 | tee "$audit_log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              rm -f "$audit_log"
              exit 0
            fi

            if grep -Eq 'audit endpoint returned an error|500 Internal Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|ECONNRESET|ETIMEDOUT' "$audit_log"; then
              rm -f "$audit_log"
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit service unavailable; retrying in $((attempt * 20)) seconds..."
                sleep $((attempt * 20))
                continue
              fi
            fi

            rm -f "$audit_log"
            exit "$status"
          done

  migrations-reset:
    name: supabase db reset (migrations replay from empty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Clean stale Supabase containers
        run: |
          supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true

      - name: Start local stack (applies supabase/migrations from empty)
        run: supabase start

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup || true

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
