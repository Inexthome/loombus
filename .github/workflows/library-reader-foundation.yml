name: Library Reader foundation

on:
  pull_request:
    paths:
      - "src/app/library/read/**"
      - "src/components/library/library-reader-surface.tsx"
      - "scripts/verification/verify-library-reader-foundation.mjs"
      - ".github/workflows/library-reader-foundation.yml"
  push:
    branches: [main]
    paths:
      - "src/app/library/read/**"
      - "src/components/library/library-reader-surface.tsx"
      - "scripts/verification/verify-library-reader-foundation.mjs"
      - ".github/workflows/library-reader-foundation.yml"

permissions:
  contents: read

jobs:
  verify-library-reader-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Library Reader foundation
        run: node scripts/verification/verify-library-reader-foundation.mjs
