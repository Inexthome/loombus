name: Blocked Members Editorial UI

on:
  pull_request:
    paths:
      - "src/app/blocked-users/blocked-users-v2-client.tsx"
      - "src/app/blocked-users/blocked-users-v2.css"
      - "src/app/blocked-users/page.tsx"
      - "scripts/verification/verify-blocked-members-editorial-ui.mjs"
      - ".github/workflows/blocked-members-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Blocked Members Editorial UI
        run: node scripts/verification/verify-blocked-members-editorial-ui.mjs
