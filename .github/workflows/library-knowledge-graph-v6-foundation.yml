name: Library Knowledge Graph v6 foundation

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260822203500_add_library_graph_workspace_foundation.sql'
      - 'scripts/verification/verify-library-knowledge-graph-v6-foundation.mjs'
      - '.github/workflows/library-knowledge-graph-v6-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Library Knowledge Graph v6 foundation
        run: node scripts/verification/verify-library-knowledge-graph-v6-foundation.mjs
