name: Library Evidence & Knowledge runtime

on:
  pull_request:
    paths:
      - "src/app/library/research/page.tsx"
      - "src/app/library/research/evidence/**"
      - "src/components/library/library-evidence-knowledge-surface.tsx"
      - "scripts/verification/verify-library-evidence-knowledge-runtime.mjs"
      - ".github/workflows/library-evidence-knowledge-runtime.yml"
  push:
    paths:
      - "src/app/library/research/page.tsx"
      - "src/app/library/research/evidence/**"
      - "src/components/library/library-evidence-knowledge-surface.tsx"
      - "scripts/verification/verify-library-evidence-knowledge-runtime.mjs"
      - ".github/workflows/library-evidence-knowledge-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-evidence-knowledge-runtime.mjs
