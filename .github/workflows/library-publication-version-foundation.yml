name: Library publication version foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260823235000_add_library_publication_version_foundation.sql"
      - "supabase/migrations/20260823235500_harden_library_publication_version_foundation.sql"
      - "scripts/verification/verify-library-publication-version-foundation.mjs"
      - ".github/workflows/library-publication-version-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Library publication version foundation
        run: node scripts/verification/verify-library-publication-version-foundation.mjs
