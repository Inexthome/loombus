name: Requests Manage Editorial UI

on:
  pull_request:
    paths:
      - "src/app/requests/manage/**"
      - "src/components/requests-manager-page.tsx"
      - "scripts/verification/verify-requests-manage-editorial-ui.mjs"
      - ".github/workflows/requests-manage-editorial-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Requests manage Editorial UI
        run: node scripts/verification/verify-requests-manage-editorial-ui.mjs
