name: Policy content governance

on:
  pull_request:
    paths:
      - "src/lib/policy-content-registry.ts"
      - "src/lib/policy-content-registry.data.json"
      - "src/lib/policy-content-payload.ts"
      - "src/lib/policy-content-payload-registry.ts"
      - "src/lib/policy-content-resolver.ts"
      - "src/lib/policy-content-history.ts"
      - "src/lib/policy-content-canonical-route.ts"
      - "src/lib/policy-content-public-discovery.ts"
      - "src/lib/public-help-catalog.ts"
      - "src/content/policies/**"
      - "src/components/policy-content/**"
      - "src/components/public-policy-page.tsx"
      - "src/components/public-policy-page.module.css"
      - "src/app/admin/policy-content-preview/**"
      - "src/app/api/admin/policy-content-preview/**"
      - "src/app/policies/archive/**"
      - "src/app/policies/history/**"
      - "src/app/accessibility/layout.tsx"
      - "src/app/support/**"
      - "docs/policy-content/**"
      - "docs/trust-safety/drafts/**"
      - "scripts/verification/verify-policy-content-registry.mjs"
      - "scripts/verification/verify-policy-accessibility-parity.mjs"
      - "scripts/verification/verify-policy-accessibility-successor.mjs"
      - "scripts/verification/verify-policy-accessibility-successor-activation.mjs"
      - "scripts/verification/verify-policy-jump-print.mjs"
      - "scripts/verification/verify-policy-help-discovery.mjs"
      - "scripts/verification/verify-policy-scheduled-effective-runtime.mjs"
      - "scripts/verification/verify-policy-structured-preview.mjs"
      - "scripts/verification/verify-policy-resolution-foundation.mjs"
      - "scripts/verification/verify-policy-keyboard-focus.mjs"
      - "scripts/verification/verify-policy-history-archive-foundation.mjs"
      - "scripts/verification/verify-policy-canonical-route-switchover.mjs"
      - ".github/workflows/policy-content-governance.yml"
      - "src/app/about/page.tsx"
      - "src/app/accessibility/page.tsx"
      - "src/app/ai-usage/page.tsx"
      - "src/app/cookies/page.tsx"
      - "src/app/dmca/page.tsx"
      - "src/app/guidelines/page.tsx"
      - "src/app/privacy/page.tsx"
      - "src/app/refunds/page.tsx"
      - "src/app/safety/page.tsx"
      - "src/app/settings/guide/page.tsx"
      - "src/app/terms/page.tsx"
  push:
    branches:
      - main
    paths:
      - "src/lib/policy-content-registry.ts"
      - "src/lib/policy-content-registry.data.json"
      - "src/lib/policy-content-payload.ts"
      - "src/lib/policy-content-payload-registry.ts"
      - "src/lib/policy-content-resolver.ts"
      - "src/lib/policy-content-history.ts"
      - "src/lib/policy-content-canonical-route.ts"
      - "src/lib/policy-content-public-discovery.ts"
      - "src/lib/public-help-catalog.ts"
      - "src/content/policies/**"
      - "src/components/policy-content/**"
      - "src/components/public-policy-page.tsx"
      - "src/components/public-policy-page.module.css"
      - "src/app/admin/policy-content-preview/**"
      - "src/app/api/admin/policy-content-preview/**"
      - "src/app/policies/archive/**"
      - "src/app/policies/history/**"
      - "src/app/accessibility/layout.tsx"
      - "src/app/support/**"
      - "docs/policy-content/**"
      - "docs/trust-safety/drafts/**"
      - "scripts/verification/verify-policy-content-registry.mjs"
      - "scripts/verification/verify-policy-accessibility-parity.mjs"
      - "scripts/verification/verify-policy-accessibility-successor.mjs"
      - "scripts/verification/verify-policy-accessibility-successor-activation.mjs"
      - "scripts/verification/verify-policy-jump-print.mjs"
      - "scripts/verification/verify-policy-help-discovery.mjs"
      - "scripts/verification/verify-policy-scheduled-effective-runtime.mjs"
      - "scripts/verification/verify-policy-structured-preview.mjs"
      - "scripts/verification/verify-policy-resolution-foundation.mjs"
      - "scripts/verification/verify-policy-keyboard-focus.mjs"
      - "scripts/verification/verify-policy-history-archive-foundation.mjs"
      - "scripts/verification/verify-policy-canonical-route-switchover.mjs"
      - ".github/workflows/policy-content-governance.yml"
      - "src/app/about/page.tsx"
      - "src/app/accessibility/page.tsx"
      - "src/app/ai-usage/page.tsx"
      - "src/app/cookies/page.tsx"
      - "src/app/dmca/page.tsx"
      - "src/app/guidelines/page.tsx"
      - "src/app/privacy/page.tsx"
      - "src/app/refunds/page.tsx"
      - "src/app/safety/page.tsx"
      - "src/app/settings/guide/page.tsx"
      - "src/app/terms/page.tsx"

permissions:
  contents: read

jobs:
  verify-policy-content-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify versioned policy content registry
        run: node scripts/verification/verify-policy-content-registry.mjs
      - name: Verify Accessibility successor activation
        run: node scripts/verification/verify-policy-accessibility-successor-activation.mjs
      - name: Verify policy keyboard focus
        run: node scripts/verification/verify-policy-keyboard-focus.mjs
      - name: Verify policy Jump-to navigation and print views
        run: node scripts/verification/verify-policy-jump-print.mjs
      - name: Verify public Policy and Help discovery
        run: node scripts/verification/verify-policy-help-discovery.mjs
      - name: Verify scheduled effective-date runtime
        run: node scripts/verification/verify-policy-scheduled-effective-runtime.mjs
