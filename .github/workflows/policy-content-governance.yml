name: Policy content governance

on:
  pull_request:
    paths:
      - "src/lib/policy-content-registry.ts"
      - "src/lib/policy-content-registry.data.json"
      - "src/content/policies/**"
      - "docs/policy-content/**"
      - "docs/trust-safety/drafts/**"
      - "scripts/verification/verify-policy-content-registry.mjs"
      - "scripts/verification/verify-policy-accessibility-parity.mjs"
      - ".github/workflows/policy-content-governance.yml"
      - "src/app/about/page.tsx"
      - "src/app/accessibility/page.tsx"
      - "src/app/ai-usage/page.tsx"
      - "src/app/cookies/page.tsx"
      - "src/app/dmca/page.tsx"
      - "src/app/guidelines/page.tsx"
      - "src/app/privacy/page.tsx"
      - "src/app/refunds/page.tsx"
      - "src/app/safety/page.tsx"
      - "src/app/settings/guide/page.tsx"
      - "src/app/support/page.tsx"
      - "src/app/terms/page.tsx"
  push:
    branches:
      - main
    paths:
      - "src/lib/policy-content-registry.ts"
      - "src/lib/policy-content-registry.data.json"
      - "src/content/policies/**"
      - "docs/policy-content/**"
      - "docs/trust-safety/drafts/**"
      - "scripts/verification/verify-policy-content-registry.mjs"
      - "scripts/verification/verify-policy-accessibility-parity.mjs"
      - ".github/workflows/policy-content-governance.yml"
      - "src/app/about/page.tsx"
      - "src/app/accessibility/page.tsx"
      - "src/app/ai-usage/page.tsx"
      - "src/app/cookies/page.tsx"
      - "src/app/dmca/page.tsx"
      - "src/app/guidelines/page.tsx"
      - "src/app/privacy/page.tsx"
      - "src/app/refunds/page.tsx"
      - "src/app/safety/page.tsx"
      - "src/app/settings/guide/page.tsx"
      - "src/app/support/page.tsx"
      - "src/app/terms/page.tsx"

permissions:
  contents: read

jobs:
  verify-policy-content-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify versioned policy content registry
        run: node scripts/verification/verify-policy-content-registry.mjs
      - name: Verify Accessibility structured payload parity
        run: node scripts/verification/verify-policy-accessibility-parity.mjs
