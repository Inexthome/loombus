name: Admin Editorial UI

on:
  pull_request:
    paths:
      - "src/app/admin/**"
      - "scripts/verification/verify-admin-editorial-ui.mjs"
      - ".github/workflows/admin-editorial-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Admin Editorial UI
        run: node scripts/verification/verify-admin-editorial-ui.mjs
