name: Rooms Editorial UI

on:
  pull_request:
    paths:
      - "src/app/rooms/**"
      - "src/components/room-route-frame-v4.tsx"
      - "src/components/rooms-shell.tsx"
      - "scripts/verification/verify-rooms-editorial-ui.mjs"
      - ".github/workflows/rooms-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Rooms Editorial UI
        run: node scripts/verification/verify-rooms-editorial-ui.mjs
