name: Admin Member and Commerce Editorial UI

on:
  pull_request:
    paths:
      - "src/app/admin/users/**"
      - "src/app/admin/support/**"
      - "src/app/admin/communications/**"
      - "src/app/admin/ai-access/**"
      - "src/app/admin/billing/**"
      - "src/app/admin/professional-booking/payments/**"
      - "src/app/admin/admin-member-commerce-editorial-frame.tsx"
      - "src/app/admin/member-commerce-editorial.css"
      - "scripts/verification/verify-admin-member-commerce-editorial-ui.mjs"
      - ".github/workflows/admin-member-commerce-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Admin Member and Commerce Editorial UI
        run: node scripts/verification/verify-admin-member-commerce-editorial-ui.mjs
