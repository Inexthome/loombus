name: Inbox Hub Editorial UI

on:
  pull_request:
    paths:
      - "src/app/inbox/page.tsx"
      - "src/app/inbox/inbox.css"
      - "scripts/verification/verify-inbox-hub-editorial-ui.mjs"
      - ".github/workflows/inbox-hub-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Inbox Hub Editorial UI
        run: node scripts/verification/verify-inbox-hub-editorial-ui.mjs
