name: Library Discussion Feedback foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260822083000_add_library_discussion_feedback_foundation.sql"
      - "scripts/verification/verify-library-discussion-feedback-foundation.mjs"
      - ".github/workflows/library-discussion-feedback-foundation.yml"
  push:
    paths:
      - "supabase/migrations/20260822083000_add_library_discussion_feedback_foundation.sql"
      - "scripts/verification/verify-library-discussion-feedback-foundation.mjs"
      - ".github/workflows/library-discussion-feedback-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verification/verify-library-discussion-feedback-foundation.mjs
