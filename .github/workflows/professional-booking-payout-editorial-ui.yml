name: Professional Booking Payout Editorial UI

on:
  pull_request:
    paths:
      - "src/app/appointments/professional-payout/page.tsx"
      - "src/components/professional-booking-payout-card.tsx"
      - "scripts/verification/verify-professional-booking-payout-editorial-ui.mjs"
      - ".github/workflows/professional-booking-payout-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Professional Booking Payout Editorial UI
        run: node scripts/verification/verify-professional-booking-payout-editorial-ui.mjs
