name: Library discover published filter

on:
  pull_request:
    paths:
      - "src/components/library/library-functional-surface.tsx"
      - "scripts/verification/verify-library-discover-published-filter.mjs"
      - ".github/workflows/library-discover-published-filter.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published-only Library discovery
        run: node scripts/verification/verify-library-discover-published-filter.mjs
