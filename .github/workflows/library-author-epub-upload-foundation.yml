name: Library author EPUB upload foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260823023000_add_library_author_epub_upload_foundation.sql"
      - "scripts/verification/verify-library-author-epub-upload-foundation.mjs"
      - ".github/workflows/library-author-epub-upload-foundation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Library author EPUB upload foundation
        run: node scripts/verification/verify-library-author-epub-upload-foundation.mjs
