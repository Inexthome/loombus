name: Apply Room subscription ladder refresh

on:
  push:
    branches:
      - agent/room-subscription-ladder-refresh

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/room-subscription-ladder-refresh
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply approved Room subscription ladder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact match, found {count}: {old[:100]!r}")
              write(path, value.replace(old, new, 1))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              value = read(path)
              count = value.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} matches, found {count}: {old[:100]!r}")
              write(path, value.replace(old, new))

          def replace_regex(path: str, pattern: str, new: str, expected: int = 1) -> None:
              value = read(path)
              updated, count = re.subn(pattern, new, value, flags=re.S)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} regex matches, found {count}: {pattern}")
              write(path, updated)

          entitlements = "src/lib/room-plan-entitlements.ts"
          replace_once(
              entitlements,
              '  | "pro"\n  | "organization"',
              '  | "pro"\n  | "business"\n  | "organization"',
