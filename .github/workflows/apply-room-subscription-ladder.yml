          } from "lucide-react";
          import { type FormEvent, useEffect, useState } from "react";
          import { supabase } from "@/lib/supabase/client";

          type Props = {
            initialOrganization: string;
            initialUseCase: string;
            initialModel: string;
            roomId: string;
            currentPlan: string;
          };

          type SubmissionState =
            | { tone: "success" | "error"; message: string }
