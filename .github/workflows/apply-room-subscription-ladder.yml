              currency,
              minimumFractionDigits: unitAmount % 100 === 0 ? 0 : 2,
              maximumFractionDigits: 2,
            }).format(unitAmount / 100);
            const interval = price.recurring?.interval;
            return interval ? `${value}/${interval}` : value;
