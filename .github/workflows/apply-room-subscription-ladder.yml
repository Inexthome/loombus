            },
            enterprise: {
              label: "Loombus Organization Enterprise",
              priceLabel: "Custom",
              priceEnvVar: "STRIPE_ROOM_ORGANIZATION_ENTERPRISE_MONTHLY_PRICE_ID",
              memberLimit: null,
              selfServe: false,
            },
          } as const;''',
          )
          replace_once(
              billing,
