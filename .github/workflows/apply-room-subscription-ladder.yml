            { planKey: "organization", envName: "STRIPE_ROOM_ORGANIZATION_MONTHLY_PRICE_ID" },''',
              '''  { planKey: "pro", envName: "STRIPE_ROOM_PRO_MONTHLY_PRICE_ID" },
            { planKey: "business", envName: "STRIPE_ROOM_BUSINESS_MONTHLY_PRICE_ID" },
