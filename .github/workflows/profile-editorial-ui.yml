name: Profile Editorial UI

on:
  pull_request:
    paths:
      - "src/app/profile/**"
      - "src/components/profile-workspace-controller.tsx"
      - "src/components/profile-viewers-panel.tsx"
      - "src/components/creator-hub-phase-one.tsx"
      - "src/components/creator-supporter-program-manager-phase2.tsx"
      - "src/components/creator-paid-supporter-manager.tsx"
      - "scripts/verification/verify-profile-editorial-ui.mjs"
      - ".github/workflows/profile-editorial-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Profile Editorial UI
        run: node scripts/verification/verify-profile-editorial-ui.mjs
