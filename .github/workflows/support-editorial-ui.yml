name: Support Editorial UI

on:
  pull_request:
    paths:
      - "src/app/support/support-v2.css"
      - "src/app/support/policy-help-discovery.css"
      - "src/app/support/page.tsx"
      - "src/app/support/support-v2-client.tsx"
      - "scripts/verification/verify-support-editorial-ui.mjs"
      - ".github/workflows/support-editorial-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Support Editorial UI
        run: node scripts/verification/verify-support-editorial-ui.mjs
